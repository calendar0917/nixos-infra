# Keep the host shell's proxy variables out of the app containers. The host
# Docker daemon already has its own proxy for image pulls; inside a container
# 127.0.0.1:7897 is the container itself, not Mihomo.
x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  NO_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

services:
  api:
    environment: *no-proxy
  worker:
    environment: *no-proxy
  supervisor:
    environment:
      # One computer per Space and one active desktop per computer: the host has
      # 5.7 GiB RAM, so concurrent Chromium instances would compete for swap.
      SANDBOX_MAX_COMPUTERS_PER_SPACE: "1"
      SANDBOX_TEAM_SCREEN_LIMIT: "1"
