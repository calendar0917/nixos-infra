name: nixos-smoke

services:
  smoke:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=1m
    mem_limit: 128m
    pids_limit: 64
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
