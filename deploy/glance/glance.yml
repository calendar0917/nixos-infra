# Glance 服务总览
#
# 运行方式：systemctl --user（见 deploy/glance/README.md）
# 二进制：~/opt/glance/glance（v0.8.8，单个 Go 静态文件）
# 入口：https://home.20050917.xyz（cloudflared 隧道 → 127.0.0.1:8770）
#
# 改这个文件后：systemctl --user restart glance
# 字段名以 v0.8.8 的文档为准：bookmarks 的分组和链接都用 title，不是 name

server:
  address: 127.0.0.1
  port: 8770

branding:
  app-name: Fleet

# 唯一账号。口令只以明文形式存在（0.8.8 的 bcrypt 实测不生效，见 README）
auth:
  $include: auth.yml

pages:
  - name: 概览
    slug: home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: server-stats
            title: main

          - type: monitor
            title: 服务状态
            cache: 1m
            sites:
              - title: pi
                url: https://pi.20050917.xyz
                alt-status-codes: [307]
              - title: vault
                url: https://vault.20050917.xyz
              - title: api
                url: https://api.20050917.xyz
              - title: teamup
                url: https://teamup.20050917.xyz
              - title: pi-web :30141
                url: http://127.0.0.1:30141
                alt-status-codes: [307]
              - title: axonhub :8090
                url: http://127.0.0.1:8090
              - title: artex :8787
                url: http://127.0.0.1:8787
              - title: vaultwarden :8222
                url: http://127.0.0.1:8222

      - size: full
        widgets:
          - type: bookmarks
            title: 常用入口
            groups:
              - title: 对外域名
                links:
                  - title: pi
                    description: 20050917.xyz 的 pi 面板
                    url: https://pi.20050917.xyz
                    icon: si:raspberrypi
                  - title: vault
                    description: Vaultwarden
                    url: https://vault.20050917.xyz
                    icon: si:vaultwarden
                  - title: api
                    description: axonhub
                    url: https://api.20050917.xyz
                    icon: mdi:api
                  - title: teamup
                    description: TeamUp 生产站
                    url: https://teamup.20050917.xyz
                    icon: mdi:account-group

              - title: main（笔记本本机）
                links:
                  - title: pi-web :30141
                    url: http://127.0.0.1:30141
                    icon: mdi:web
                  - title: axonhub :8090
                    url: http://127.0.0.1:8090
                    icon: mdi:robot-outline
                  - title: artex :8787
                    url: http://127.0.0.1:8787
                    icon: mdi:shield-lock-outline
                  - title: DS Bot :35721
                    url: http://127.0.0.1:35721
                    icon: mdi:robot-happy-outline

              - title: 其他机器（tailscale）
                links:
                  - title: nixos
                    description: 100.107.6.15
                    url: http://100.107.6.15
                    icon: mdi:server
                  - title: az
                    description: 100.125.26.18 · india
                    url: http://100.125.26.18
                    icon: mdi:server
                  - title: hw
                    description: 100.85.48.79 · hcss-ecs-1e04
                    url: http://100.85.48.79
                    icon: mdi:server
                  - title: pve-old
                    description: 别人的宿主机，只登记
                    url: https://pve-old.yulinsec.cn
                    icon: si:proxmox

  - name: 机器
    slug: hosts
    columns:
      - size: full
        widgets:
          # 四台的实时状态。数据来自 scripts/fleet-status --json，
          # 经 deploy/glance/fleet-json.py（127.0.0.1:8771，systemctl --user
          # 单元 fleet-json.service）转发——Glance 自带的 server-stats 只认本机。
          - type: custom-api
            title: 四台状态（fleet-status）
            cache: 1m
            url: http://127.0.0.1:8771/fleet.json
            template: |
              <div class="flex justify-between size-h6 margin-block-5 color-paragraph">
                <span>机器</span><span>运行 · 负载 · 磁盘 · 失败单元</span>
              </div>
              <ul class="list list-gap-10">
              {{ range .JSON.Array "hosts" }}
                <li>
                  <div class="flex justify-between items-center">
                    <a class="size-h4 color-highlight" href="http://{{ .String "tailscale" }}" target="_blank" rel="noreferrer">{{ .String "host" }}</a>
                    {{ if .Bool "reachable" }}
                      <span class="size-h6 color-paragraph" title="{{ .String "os" }}">{{ .String "up" }} · 负载 {{ .String "load" }} · {{ .String "disk" }}
                      {{- if ne (.String "failed") "0" }} · <span class="color-negative">失败 {{ .String "failed" }}</span>{{ end }}</span>
                    {{ else }}
                      <span class="size-h6 color-negative">不可达</span>
                    {{ end }}
                  </div>
                </li>
              {{ end }}
              </ul>

          - type: bookmarks
            title: 四台纳管机器
            groups:
              - title: 直连入口
                links:
                  - title: main
                    description: 本地 · 100.98.145.40 · NixOS 26.11
                    url: http://127.0.0.1:35721
                    icon: mdi:laptop
                  - title: nixos
                    description: 100.107.6.15 · NixOS 26.11 · uptime 31d
                    url: http://100.107.6.15
                    icon: mdi:server
                  - title: az
                    description: 100.125.26.18 · Ubuntu 22.04 · india
                    url: http://100.125.26.18
                    icon: mdi:server
                  - title: hw
                    description: 100.85.48.79 · Debian 12 · hcss-ecs-1e04
                    url: http://100.85.48.79
                    icon: mdi:server

              - title: 不纳管（只登记）
                links:
                  - title: pve-old
                    description: 别人的 Proxmox 宿主机
                    url: https://pve-old.yulinsec.cn
                    icon: si:proxmox
                  - title: pve-new
                    description: 经 pve-old 跳板 · 192.168.31.45
                    url: https://pve-old.yulinsec.cn
                    icon: si:proxmox

              - title: 团队项目
                links:
                  - title: TeamUp 生产
                    url: https://teamup.20050917.xyz
                    icon: mdi:account-group
                  - title: UESTC-Teamup 仓库
                    url: https://github.com/calendar0917/UESTC-Teamup
                    icon: si:github
                  - title: nixos-infra 仓库
                    url: https://github.com/calendar0917/nixos-infra
                    icon: si:github