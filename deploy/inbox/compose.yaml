# Inbox hub for main: mail aggregation (SnappyMail) + push notifications (ntfy).
#
# Only loopback ports are published; Cloudflare Tunnel (cloudflared-pi) reaches
# them from 127.0.0.1, so no inbound firewall port is opened. See README.md.
name: inbox

services:
  snappymail:
    image: ${SNAPPYMAIL_IMAGE:?Set SNAPPYMAIL_IMAGE in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SNAPPYMAIL_PORT:-24080}:8888"
    environment:
      # Per-request PHP memory cap. The image already ships nginx + php-fpm, so
      # there is nothing else to run: no database container.
      MEMORY_LIMIT: ${SNAPPYMAIL_MEMORY_LIMIT:-128M}
      UPLOAD_MAX_SIZE: ${SNAPPYMAIL_UPLOAD_MAX_SIZE:-25M}
      # The public entry is HTTPS (Cloudflare Tunnel), so session cookies are
      # Secure. A plain http://127.0.0.1 check still returns the login page.
      SECURE_COOKIES: "true"
    volumes:
      # Holds the admin password, every account's settings and the list of
      # additional accounts. Losing it means re-adding every mailbox.
      - snappymail_data:/var/lib/snappymail
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8888/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ntfy:
    image: ${NTFY_IMAGE:?Set NTFY_IMAGE in .env}
    restart: unless-stopped
    command: serve
    ports:
      - "127.0.0.1:${NTFY_PORT:-2586}:2586"
    environment:
      # Must be the URL clients type (the tunnel hostname), otherwise push
      # subscription links point at localhost.
      NTFY_BASE_URL: ${NTFY_BASE_URL:?Set NTFY_BASE_URL in .env}
      NTFY_LISTEN_HTTP: 0.0.0.0:2586
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      # No anonymous topics: every topic is a credential.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      # Uncomment to let the Android app receive pushes through ntfy.sh's
      # FCM relay without keeping a websocket open. Trade-off: message
      # metadata passes through the public ntfy.sh instance.
      # NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  snappymail_data:
  ntfy_cache:
  ntfy_lib:

networks:
  backend:
    driver: bridge