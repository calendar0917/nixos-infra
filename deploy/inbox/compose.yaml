# Inbox hub for main: mail aggregation (Gofer) + push notifications (ntfy).
#
# Only loopback ports are published; Cloudflare Tunnel (cloudflared-pi) reaches
# them from 127.0.0.1, so no inbound firewall port is opened. See README.md.
name: inbox

services:
  gofer:
    image: ${GOFER_IMAGE:?Set GOFER_IMAGE in .env}
    restart: unless-stopped
    ports:
      # Gofer listens on 8090 inside the container. The host side stays 24080
      # because 127.0.0.1:8090 already belongs to api.20050917.xyz; the tunnel
      # ingress for mail.20050917.xyz therefore needs no change.
      - "127.0.0.1:${GOFER_PORT:-24080}:8090"
    environment:
      # Browsers open this address, so links inside mail and the sign-in
      # cookie domain have to be the public hostname, not the loopback one.
      GOFER_BASE_URL: ${GOFER_BASE_URL:?Set GOFER_BASE_URL in .env}
      # One protected profile holding several mailboxes. "managed" would give
      # every user a separate database; this install has a single person.
      GOFER_AUTH_MODE: personal
      # cloudflared connects to the published host port, so the request enters
      # the container from the Docker bridge gateway and Gofer only trusts the
      # real client address (X-Forwarded-For) from there.
      GOFER_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      # Sender pictures: ask Gravatar and Libravatar about the address only.
      # bimi and domain_icon would contact servers chosen by the sender, which
      # leaks that you are reading the mail to whoever sent it.
      GOFER_AVATAR_PROVIDERS: gravatar,libravatar
      # Off: keeps font lists and files on the server instead of fetching them
      # from Google.
      GOFER_GOOGLE_FONTS: "false"
      # Refuse to start rather than convert the database storage layout in
      # place. Uncomment when switching this install to managed mode, so the
      # conversion waits for a backup.
      # GOFER_PREVENT_STORAGE_CONVERSION: "true"
    volumes:
      # The whole install: mail store, account settings, encryption keys and
      # the setup token state. Losing it means re-adding every mailbox.
      - gofer_data:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    # The image ships HEALTHCHECK "gofer healthcheck"; compose inherits it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ntfy:
    image: ${NTFY_IMAGE:?Set NTFY_IMAGE in .env}
    restart: unless-stopped
    command: serve
    ports:
      - "127.0.0.1:${NTFY_PORT:-2586}:2586"
    environment:
      # Must be the URL clients type (the tunnel hostname), otherwise push
      # subscription links point at localhost.
      NTFY_BASE_URL: ${NTFY_BASE_URL:?Set NTFY_BASE_URL in .env}
      NTFY_LISTEN_HTTP: 0.0.0.0:2586
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      # No anonymous topics: every topic is a credential.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      # Uncomment to let the Android app receive pushes through ntfy.sh's
      # FCM relay without keeping a websocket open. Trade-off: message
      # metadata passes through the public ntfy.sh instance.
      # NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gofer_data:
  ntfy_cache:
  ntfy_lib:

networks:
  backend:
    driver: bridge