# ---------------------------------------------------
# 基础配置
# ---------------------------------------------------
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

# TUN 模式
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53

# DNS 优化：解决国内网站解析慢和国外 DNS 污染问题
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [223.5.5.5, 119.29.29.29]
  fallback: [1.1.1.1, 8.8.8.8, https://dns.google/dns-query]
  fallback-filter:
    geoip: false
    # geoip-code: CN
    ipcidr: [240.0.0.0/4]

# ---------------------------------------------------
# 1. 节点配置（你的优选 VLESS）
# ---------------------------------------------------
proxies:
  - name: "Shopify-优选节点"
    type: vless
    server: shopify.com           # <--- 物理连接的 CDN 优选地址
    port: 443
    uuid: d17568b4-1a07-4960-a497-ad5fdf4ec43b
    udp: true
    tls: true
    servername: do.calendar.de5.net    # <--- TLS 握手域名（SNI）
    network: ws
    ws-opts:
      path: /d17568b4-1a07-4960-a497-ad5fdf4ec43b
      headers:
        Host: do.calendar.de5.net      # <--- HTTP Host 头部

# ---------------------------------------------------
# 2. 策略组配置
# ---------------------------------------------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - Shopify-优选节点
      - DIRECT

  - name: 🛑 广告过滤
    type: select
    proxies:
      - REJECT
      - DIRECT

# ---------------------------------------------------
# 3. 规则集（使用 Mihomo 远程规则，保持最新）
# ---------------------------------------------------
rule-providers:
  ads:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml"
    path: ./ruleset/ads.yaml
    interval: 86400

  cn_domain:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.yaml"
    path: ./ruleset/cn_domain.yaml
    interval: 86400

  cn_ip:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.yaml"
    path: ./ruleset/cn_ip.yaml
    interval: 86400

# ---------------------------------------------------
# 4. 路由规则逻辑
# ---------------------------------------------------
rules:
  - RULE-SET,ads,🛑 广告过滤
  - DOMAIN,do.calendar.de5.net,DIRECT  # <--- 把这里的 DOMAIN-XIP 改成 DOMAIN
  - GEOIP,lan,DIRECT,no-resolve
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT
  - MATCH,🚀 节点选择
