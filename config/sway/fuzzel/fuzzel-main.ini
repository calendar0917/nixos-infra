[main]
# main-only Fuzzel theme: larger text and a wider window to match the 2560x1600
# internal panel. The shared config/sway/fuzzel/fuzzel.ini keeps the mini host's
# original geometry.
font=JetBrains Mono:size=14
terminal=kitty
width=54
lines=14
horizontal-pad=20
vertical-pad=12
inner-pad=8
prompt=run:
icons-enabled=yes

[colors]
background=1e1e2eff
text=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
border=89b4faff

[border]
width=1
radius=8
